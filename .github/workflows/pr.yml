name: PR

on:
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin@v4.2.2
        with:
          # Full history needed so the lint lane can run git diff origin/<base>...HEAD
          fetch-depth: 0

      # Read .xcode-version and pass it to setup-xcode (the action only accepts
      # xcode-version as a string, not a file path).
      - name: Read Xcode version
        id: xcode-ver
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # pin@v1.6.0
        with:
          xcode-version: ${{ steps.xcode-ver.outputs.version }}

      # ruby-version is read from .ruby-version automatically.
      # bundler: 'Gemfile.lock' installs the exact bundler version from BUNDLED WITH.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # pin@v1
        with:
          bundler: 'Gemfile.lock'

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # pin@v4.2.3
        with:
          path: vendor/bundle
          key: bundle-v1-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-v1-

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # pin@v4.2.3
        with:
          path: Carthage/Build
          # Scope the key to the Xcode version: prebuilt xcframeworks are tied to a
          # Swift/module ABI, so rehydrating a cache built with a different Xcode
          # (when .xcode-version bumps but Cartfile.resolved doesn't) causes module
          # mismatches at test-link time. The restore-key is Xcode-scoped too.
          key: carthage-v2-${{ steps.xcode-ver.outputs.version }}-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: carthage-v2-${{ steps.xcode-ver.outputs.version }}-

      - name: Install Ruby dependencies
        run: bundle check || bundle install --jobs 4 --retry 3
        env:
          BUNDLE_PATH: vendor/bundle

      # SwiftLint and Carthage are not guaranteed on macos-15 runners.
      # --skip-deps bypasses the brew installs in dependencies.sh, so do them here.
      - name: Install tools (SwiftLint + Carthage)
        run: |
          brew install swiftlint
          brew install carthage

      # Bootstrap Carthage test deps (Quick/Nimble/SimpleKeychain). --cache-builds
      # makes this a no-op when the cached xcframeworks are still valid, so it's
      # safe to run unconditionally; the cache step above provides the speed-up.
      - name: Bootstrap Carthage dependencies
        run: |
          XCODE_XCCONFIG_FILE="$GITHUB_WORKSPACE/carthage_build.xcconfig" \
            carthage bootstrap --use-xcframeworks --cache-builds --platform iOS
          echo "Carthage/Build contents:"
          ls Carthage/Build/ 2>/dev/null || echo "  (empty)"

      - name: Lint + Test + Coverage
        run: ./build.sh --buildType debug --lint --test --coverage --nobuild --skip-deps
        env:
          BUNDLE_PATH: vendor/bundle
          # The Fastfile defaults the scan destination to "iPhone 17", which only
          # exists on Xcode 26+. CI pins Xcode 16.4 (.xcode-version), whose newest
          # simulator is "iPhone 16" — override the device so the destination
          # resolves. Bump this in lockstep with .xcode-version.
          GUARDIAN_SCAN_DEVICE: iPhone 16

      # Fallback: re-run the dashboard generator if the main step failed before
      # postbuild ran (e.g. a lint error). This attaches whatever partial reports exist.
      - name: Generate reports.html (failure fallback)
        if: failure()
        run: ./tools/build/reports.sh
        env:
          BUNDLE_PATH: vendor/bundle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4.6.2
        if: always()
        with:
          name: reports
          path: |
            output/reports.html
            output/scan

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # pin@v5.3.1
        with:
          files: output/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}  # optional for public repos; required for private
          fail_ci_if_error: false
